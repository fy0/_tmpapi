name: Sync upstream into klno

# 上游是 KlN-4096/sub2api 的 klno 分支（= Wei-Shaw 上游 tag + KlN 全套定制：指纹收敛/
# turn-state/双开出站等）。KlN 那边每次发新版会把自己 rebase 到 Wei-Shaw tag 上，我们这边
# 再把 klno 的本地提交 rebase 到新的 upstream klno 上——两层叠加，任何一层冲突都只让
# run 失败（GitHub 邮件通知），不推送任何东西。
#
# 本地提交通过 merge-base 识别：our klno = upstream-klno + 本地提交。KlN rebase 后本地与
# 新 upstream 的共同祖先退回到共享的 Wei-Shaw tag，`rebase --onto upstream-klno <mb> klno`
# 恰好只重放本地提交。KlN 若改用 merge 同步也兼容（mb 落在 KlN 的提交上，同样只重放本地提交）。
#
# 冲突、测试失败、codex-rs 漂移都只让 run 失败，不推送任何东西。
# 每次运行还会把默认分支 main 重建成 upstream/main + 本文件：GitHub 的定时 workflow 只从默认
# 分支触发，main 只是 cron 的宿主，没人同步它就会一直落后。
# GITHUB_TOKEN 没有 workflows 权限：上游这段提交改过 .github/workflows 时推不动 main，只告警，
# 要用有 workflow 权限的凭据在本地重做该步。同理，改了本文件也要手动推到 main——cron 跑的是 main 那份。
#
# 出包不在这里做：push klno 后由 ghcr.yml 对非 main 分支自动构建推送 amd64+arm64 镜像。

on:
  schedule:
    - cron: '17 3 * * *' # UTC，每天一次
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: KlN-4096/sub2api
  UPSTREAM_BRANCH: klno
  FORK_BRANCH: klno
  # 已人工核对过身份恒等式的 codex 版本（正式版标签或完整提交号）；漂移检查拿它和最新正式版比（不比 main，见该步注释）
  CODEX_PINNED_REF: rust-v0.156.1
  CODEX_IDENTITY_PATHS: >-
    codex-rs/codex-api/src/requests/headers.rs
    codex-rs/codex-api/src/endpoint/responses.rs
    codex-rs/core/src/responses_metadata.rs
    codex-rs/core/src/client.rs
    codex-rs/core/src/session/session.rs
    codex-rs/core/src/state/auto_compact_window.rs

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream klno
        id: up
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --force upstream "${UPSTREAM_BRANCH}:refs/remotes/upstream-klno"
          base=$(git merge-base HEAD refs/remotes/upstream-klno)
          local_count=$(git rev-list --count "refs/remotes/upstream-klno..HEAD")
          upstream_new=$(git rev-list --count "HEAD..refs/remotes/upstream-klno")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "upstream_new=$upstream_new" >> "$GITHUB_OUTPUT"
          echo "merge-base=$base, local commits=$local_count, upstream new commits=$upstream_new"

      - name: Rebase klno onto upstream klno
        id: rebase
        if: steps.up.outputs.upstream_new != '0'
        run: |
          set -euo pipefail
          git config user.name "klno-sync-bot"
          git config user.email "klno-sync-bot@users.noreply.github.com"
          if git rebase --onto refs/remotes/upstream-klno "${{ steps.up.outputs.base }}" "${FORK_BRANCH}"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            git rebase --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on conflict
        if: steps.rebase.outputs.conflict == 'true'
        run: |
          echo "::error title=sync-upstream conflict::rebase klno 本地提交到 upstream KlN-4096 klno 冲突，需要人工处理，冲突文件见本步骤日志"
          cat /tmp/conflicts.txt
          exit 1

      - name: Setup Go
        if: steps.up.outputs.upstream_new != '0'
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build and targeted tests
        if: steps.up.outputs.upstream_new != '0'
        working-directory: backend
        run: |
          set -euo pipefail
          go build ./...
          go test -tags=unit ./internal/service -count=1 -run 'CodexFingerprintConvergence|CodexAccountIdentity|CodexFingerprint|CodexDeviceWireProfile|OAuthPassthrough|BuildOpenAIWSHeaders|SetupTokenCompat|IngressSession|CPR|OAuthOnlyGroupPredicate|BasisPoints' 2>&1 | grep -vE '"level":"(DEBUG|INFO|WARN)"' | tail -20

      - name: Check codex-rs identity sources for drift
        # 比最新正式版而不是 main：网关冒充的是用户在跑的发行版，main 上天天在改（client.rs 两周近千行），
        # 比 main 会天天红、真正的发版漂移反而淹没在噪音里。
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none https://github.com/openai/codex.git /tmp/codex
          cd /tmp/codex
          latest=$(git tag -l 'rust-v*' --sort=-v:refname | grep -E '^rust-v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n 1p)
          if ! git diff --quiet "${CODEX_PINNED_REF}" "${latest}" -- ${CODEX_IDENTITY_PATHS}; then
            git diff --stat "${CODEX_PINNED_REF}" "${latest}" -- ${CODEX_IDENTITY_PATHS}
            echo "::error title=codex-rs identity drift::codex 正式版 ${latest} 的身份文件相对 ${CODEX_PINNED_REF} 有变动，请核对 openai_codex_fingerprint_convergence.go 的恒等式，确认后更新 CODEX_PINNED_REF（并手动推到 main）。"
            exit 1
          fi
          echo "codex identity sources unchanged between ${CODEX_PINNED_REF} and ${latest}"

      - name: Push rebased branch
        if: steps.up.outputs.upstream_new != '0'
        run: |
          set -euo pipefail
          git push --force-with-lease origin "${FORK_BRANCH}"
          echo "klno rebased onto upstream klno ($(git rev-parse --short refs/remotes/upstream-klno)); ghcr.yml will build the image"

      - name: Resync default branch onto upstream
        # 前面的 drift 告警红了也要跑：main 只是 cron 宿主，同步它不该被告警牵连
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git fetch --force origin main
          git fetch --force upstream main
          behind=$(git rev-list --count origin/main..upstream/main)
          if [ "$behind" -eq 0 ]; then
            echo "default branch already level with upstream/main"
            exit 0
          fi
          # main 只承担一个职责：给 cron 当宿主。重建成 upstream/main + klno 那份本文件，
          # 不保留上游推来的版本号提交——那是镜像分支的版本号，留在宿主分支上只会打架。
          git config user.name "klno-sync-bot"
          git config user.email "klno-sync-bot@users.noreply.github.com"
          git checkout -B main upstream/main
          git checkout "${FORK_BRANCH}" -- .github/workflows/sync-upstream.yml
          git commit -q -m "ci: host sync-upstream workflow on the default branch" || true
          test -f .github/workflows/sync-upstream.yml # 丢了这个文件 cron 就停了
          if ! out=$(git push --force-with-lease origin main 2>&1); then
            echo "$out"
            if grep -q 'without .workflows. permission' <<<"$out"; then
              echo "::warning title=main 未同步::上游这段提交改过 .github/workflows，GITHUB_TOKEN 没有 workflows 权限推不动；用有 workflow 权限的凭据在本地重做本步即可。main 只是 cron 宿主，落后不影响 klno 同步。"
              exit 0
            fi
            exit 1
          fi
          echo "$out"
          echo "default branch resynced onto upstream/main ($(git rev-parse --short upstream/main)), was $behind behind"
